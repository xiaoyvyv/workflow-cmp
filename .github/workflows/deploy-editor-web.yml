name: Deploy Workflow Editor Web to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'workflow-editor-web/**'
      - 'workflow-node-*/**'
      - 'workflow-core/**'
      - '.github/workflows/deploy-editor-web.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Generate Default Action Manifest
        run: |
          chmod +x gradlew
          ./gradlew :workflow-node-all:exportManifest --no-daemon

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './workflow-editor-web'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
