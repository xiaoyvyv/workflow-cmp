<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
    <title>Workflow Editor</title>
    <link href="./style.css" rel="stylesheet"/>
</head>
<body>
<header class="toolbar">
    <div class="toolbar-brand">
        <strong>Workflow Editor</strong>
    </div>

    <div class="device-input-group">
        <span id="device-status-dot" class="device-status-dot status-disconnected" title="设备未连接"></span>
        <input id="device" class="device-input" placeholder="设备地址 (如 http://192.168.0.102:8080)"/>
    </div>
    <input id="token" class="token-input" placeholder="Token (可选)" type="password"/>
    <button id="connect" type="button" class="btn-connect">连接</button>

    <span class="toolbar-separator"></span>

    <div class="toolbar-action-group">
        <button id="load" type="button">读取</button>
        <button id="save" type="button" class="btn-save">保存</button>
        <button id="validate" type="button">校验</button>
        <button id="run" type="button" class="btn-run">运行</button>
    </div>

    <div class="toolbar-right">
        <button id="manifest" type="button">导入 Manifest</button>
        <button id="workflow" type="button">导入工作流</button>
        <button id="export" type="button">导出工作流</button>
        <input hidden id="file" type="file"/>
    </div>
</header>
<main id="editor-layout">
    <aside class="palette-panel" id="panel-palette">
        <div class="palette-header" id="palette-header">
            <h3>节点</h3>
            <p class="hint" id="palette-hint"></p>
            <div class="palette-search-wrapper">
                <input id="search" placeholder="筛选节点 (名称/类型/描述)"/>
                <button id="search-clear-btn" class="search-clear-btn" title="清空筛选">✕</button>
            </div>
        </div>
        <div id="palette"></div>
    </aside>

    <div class="resizer resizer-col" id="resizer-left" title="拖拽调整左侧栏宽度"></div>

    <div class="center-area" id="center-area">
        <div class="canvas-wrapper" id="canvas-wrapper">
            <section aria-label="工作流画布" id="canvas">
                <div id="canvas-viewport">
                    <svg id="edges"></svg>
                    <div id="nodes"></div>
                    <svg id="edges-selected"></svg>
                </div>
            </section>
            <div class="canvas-controls" id="canvas-controls">
                <div class="canvas-control-group layout-control-group">
                    <div class="layout-picker" id="canvas-layout-picker">
                        <button
                                id="canvas-layout-trigger"
                                class="canvas-control-btn layout-picker-trigger"
                                type="button"
                                aria-expanded="false"
                                aria-haspopup="menu"
                                title="选择布局类型并立即格式化"
                        >
                            <span id="canvas-layout-label">水平布局</span>
                            <span class="layout-picker-chevron" aria-hidden="true">⌄</span>
                        </button>
                        <div class="layout-picker-menu" id="canvas-layout-menu" role="menu" hidden>
                            <button class="layout-picker-option" type="button" role="menuitemradio" data-layout-id="dag-lr">
                                <span>水平布局</span>
                                <small>从左到右</small>
                            </button>
                            <button class="layout-picker-option" type="button" role="menuitemradio" data-layout-id="dag-tb">
                                <span>垂直布局</span>
                                <small>从上到下</small>
                            </button>
                            <button class="layout-picker-option" type="button" role="menuitemradio" data-layout-id="dag-compact">
                                <span>紧凑布局</span>
                                <small>二维紧凑排布</small>
                            </button>
                        </div>
                    </div>
                </div>
                <span class="canvas-control-separator"></span>
                <div class="canvas-control-group">
                    <button id="zoom-out" class="canvas-control-btn zoom-btn" type="button" title="缩小 (Ctrl/Cmd + 滚轮向下)">−</button>
                    <button id="zoom-reset" class="canvas-control-btn zoom-btn zoom-level-btn" type="button" title="重置缩放 (点击设为 100%)">100%</button>
                    <button id="zoom-in" class="canvas-control-btn zoom-btn" type="button" title="放大 (Ctrl/Cmd + 滚轮向上)">+</button>
                    <button id="zoom-fit" class="canvas-control-btn zoom-btn zoom-fit-btn" type="button" title="自适应画布大小 (适合所有节点)">⛶ 适应</button>
                </div>
                <span class="canvas-control-separator"></span>
                <div class="canvas-control-group">
                    <button id="canvas-clear" class="canvas-control-btn clear-btn" type="button" title="清空画布并重置为初始工作流">🗑️ 清空</button>
                </div>
            </div>
        </div>

        <div class="resizer resizer-row" id="resizer-bottom" title="拖拽调整控制台高度"></div>

        <section class="console-panel collapsed" id="console-panel">
            <header class="console-header" id="console-header">
                <div class="console-tabs">
                    <button class="console-tab active" data-tab="events" id="tab-events">
                        <span>⚡ 设备事件</span>
                        <span class="tab-badge" id="event-count-badge">0</span>
                    </button>
                    <button class="console-tab" data-tab="logs" id="tab-logs">
                        <span>📋 运行日志</span>
                        <span class="tab-badge" id="log-count-badge">0</span>
                    </button>
                </div>
                <div class="console-actions">
                    <button id="console-copy-btn" class="console-action-btn" title="复制当前控制台内容">复制</button>
                    <button id="console-clear-btn" class="console-action-btn" title="清空当前日志">清空</button>
                    <button id="console-toggle-btn" class="console-action-btn" title="展开/收起控制台">
                        <span id="console-toggle-text">▲ 展开控制台</span>
                    </button>
                </div>
            </header>
            <div class="console-content" id="console-content">
                <div class="console-tab-pane active" id="pane-events">
                    <pre id="events" class="console-output">尚未连接设备</pre>
                </div>
                <div class="console-tab-pane" id="pane-logs">
                    <div id="logs" class="console-logs-list">
                        <div class="log-line log-info"><span class="log-time">--:--:--</span> 等待连接或工作流执行...</div>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <div class="resizer resizer-col" id="resizer-right" title="拖拽调整右侧栏宽度"></div>

    <aside class="inspector-panel" id="panel-inspector">
        <h3 id="title">配置</h3>
        <div id="inspector">选择一个节点</div>
        <div class="node-actions" id="node-actions" style="display: none;">
            <button id="set-error">设为全局错误节点</button>
            <button id="delete-node" class="btn-danger">删除此节点</button>
        </div>
    </aside>
</main>
<div id="modal-container"></div>
<div id="toast-container"></div>
<div id="small-screen-overlay" class="small-screen-overlay">
    <div class="small-screen-card">
        <div class="small-screen-icon-wrapper">
            <div class="small-screen-pulse"></div>
            <span class="small-screen-icon">💻</span>
        </div>
        <span class="small-screen-badge">建议大屏操作</span>
        <h3 class="small-screen-title">可视区域过小</h3>
        <p class="small-screen-desc">
            Workflow Editor 包含节点库、多维画布与属性检查器。<br/>
            为了获得精准的节点拖拽、连线与配置体验，建议在 <strong>PC 浏览器</strong>、<strong>Mac</strong> 或<strong>横屏平板（iPad）</strong>等大屏设备上进行操作。
        </p>
        <div class="small-screen-resolution" id="small-screen-res-info">
            当前视口：<span id="screen-current-size">-- × --</span> · 建议宽度 ≥ 768px
        </div>
        <div class="small-screen-actions">
            <button type="button" class="small-screen-btn btn-copy-url" id="btn-copy-web-url">
                <span>📋</span> 复制当前访问地址
            </button>
            <button type="button" class="small-screen-btn btn-dismiss-overlay" id="btn-dismiss-small-screen">
                仍然在此体验
            </button>
        </div>
    </div>
</div>
<script type="module" src="./app.js"></script>
</body>
</html>
